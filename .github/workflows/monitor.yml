name: SRS Matha Tatkal Release Monitor

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab anytime

jobs:
  tatkal-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Safety guard to ensure the job doesn't hang

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Availability Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u monitor.py
