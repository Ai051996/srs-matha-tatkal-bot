name: SRS Matha Tatkal Release Monitor

on:
  schedule:
    # 00:25 UTC = 05:55 IST (runs every day 5 minutes before Tatkal release)
    - cron: '25 0 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab anytime

jobs:
  tatkal-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Safety guard to ensure the job doesn't hang

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 10-Minute Polling Loop
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # -u forces unbuffered stdout so you can watch live logs in real time
        run: python -u monitor.py